apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: docker.io/melaniefig/frontend-security:1.0.0
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: secure-app
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
